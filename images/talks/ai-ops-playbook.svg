<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <rect width="600" height="340" fill="url(#glow)"/>
  
  <!-- Subtle Circuit Grid -->
  <g opacity="0.1" stroke="#00e5ff" stroke-width="1">
    <path d="M0,50 H600 M0,120 H600 M0,190 H600 M0,260 H600"/>
    <path d="M100,0 V340 M250,0 V340 M400,0 V340 M550,0 V340"/>
  </g>

  <!-- Event Tag Pill -->
  <rect x="40" y="40" width="170" height="32" rx="16" fill="#1e293b" stroke="#4285F4" stroke-width="1.5"/>
  <circle cx="56" cy="56" r="5" fill="#34A853"/>
  <text x="70" y="61" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">KEYNOTE SESSION</text>

  <!-- Big Graphic Icon -->
  <g transform="translate(450, 110)">
    <circle cx="50" cy="50" r="45" fill="#1e293b" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>
    <text x="50" y="62" font-size="40" text-anchor="middle">🤖</text>
  </g>

  <!-- Titles -->
  <text x="40" y="130" fill="url(#accent)" font-family="sans-serif" font-size="28" font-weight="800">The AI Ops Playbook</text>
  <text x="40" y="165" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="600">Building &amp; Deploying Production AI Agents</text>
  <text x="40" y="200" fill="#94a3b8" font-family="sans-serif" font-size="14">Google ADK • Multi-Agent Workflows • Cloud Run</text>

  <!-- Speaker Brand Bottom -->
  <rect x="0" y="295" width="600" height="45" fill="#090d16" opacity="0.9"/>
  <text x="40" y="323" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">Sanket Bisne</text>
  <text x="135" y="323" fill="#64748b" font-family="sans-serif" font-size="13">• Google Developer Expert (GCP)</text>
  <text x="540" y="323" fill="#00e5ff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">Sessionize / CCD</text>
</svg>
